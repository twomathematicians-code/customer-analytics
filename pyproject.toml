[tool.poetry]
name = "ml-customer-analytics"
version = "1.0.0"
description = "Customer churn prediction, RFM segmentation, and CLV estimation with XGBoost and SHAP explainability."
authors = ["Mahesh Solanki <maheshsinh1910@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
scikit-learn = "^1.5"
xgboost = "^2.0"
lightgbm = "^4.3"
shap = "^0.45"
pandas = "^2.2"
numpy = "^1.26"
httpx = "^0.27"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "^0.4"
black = "^24.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
