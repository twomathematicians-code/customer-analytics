services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://cust:cust123@db:5432/customer_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cust
      POSTGRES_PASSWORD: cust123
      POSTGRES_DB: customer_db
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cust"]
      interval: 5s
      retries: 5

volumes:
  pg:
