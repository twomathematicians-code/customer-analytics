stages: [lint, test, build]
lint:
  image: python:3.11-slim
  script:
    - pip install poetry && poetry install --only dev
    - poetry run ruff check . && poetry run black --check .
  only: [main, merge_requests]
test:
  image: python:3.11-slim
  services: [postgres:16-alpine]
  variables: {POSTGRES_DB: cust_test, POSTGRES_USER: cust, POSTGRES_PASSWORD: cust123}
  script:
    - apt-get update -qq && apt-get install -y -qq libpq-dev
    - pip install poetry && poetry install --with dev
    - poetry run pytest tests/ -v --cov
  only: [main, merge_requests]
build:
  image: docker:24-dind
  services: [docker:24-dind]
  script: docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA . && docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  only: [main]
